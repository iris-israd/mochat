<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mochat!</title>
</head>
<body>
    <h1>Welcome to Mochat!</h1>

    <!-- Sección para el nombre de usuario -->
    <div>
        <input type="text" id="username" placeholder="Tu nombre de usuario" />
        <button id="sendun">Set Username</button>
    </div>

    <br>

    <!-- Caja de chat y envío de mensajes -->
    <div id="box" style="border: 1px solid #ccc; height: 200px; overflow-y: scroll; margin-bottom: 10px; padding: 5px;"></div>
    <input type="text" id="msgin" placeholder="Type in a message" />
    <button id="send">Send</button>

    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
